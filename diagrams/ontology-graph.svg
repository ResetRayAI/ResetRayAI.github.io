  <text class="sub" x="900" y="415">semantic object</text>

  <line class="line" x1="330" y1="115" x2="470" y2="250"/>
  <line class="line" x1="330" y1="395" x2="470" y2="270"/>
  <line class="line" x1="600" y1="160" x2="600" y2="210"/>
  <line class="line" x1="850" y1="115" x2="730" y2="250"/>
  <line class="line" x1="730" y1="270" x2="850" y2="395"/>

  <text class="sub" x="335" y="490">Public semantic ontology diagram only — no production implementation, ROI logic or validation workflow.</text>
