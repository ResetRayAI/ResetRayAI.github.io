<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#070b12"/>
  <style>
    .node{fill:#101827;stroke:#7fb7ff;stroke-width:2;rx:18}
    .main{fill:#13233a;stroke:#9f7bff;stroke-width:3;rx:22}
    .txt{fill:#eef4ff;font-family:Arial,sans-serif;font-size:22px;font-weight:700}
    .sub{fill:#9fb2c8;font-family:Arial,sans-serif;font-size:15px}
    .line{stroke:#7fb7ff;stroke-width:3;opacity:.85}
  </style>

  <rect class="main" x="470" y="210" width="260" height="100"/>
  <text class="txt" x="560" y="250">RSIF</text>
  <text class="sub" x="505" y="280">structured semantic export</text>

  <rect class="node" x="80" y="70" width="250" height="90"/>
  <text class="txt" x="125" y="108">CT Attenuation</text>
  <text class="sub" x="132" y="135">quantitative concept</text>

  <rect class="node" x="80" y="350" width="250" height="90"/>
  <text class="txt" x="170" y="388">ROI</text>
  <text class="sub" x="128" y="415">measurement region</text>

  <rect class="node" x="470" y="70" width="260" height="90"/>
  <text class="txt" x="515" y="108">Hounsfield Units</text>
  <text class="sub" x="552" y="135">HU scale</text>

  <rect class="node" x="850" y="70" width="260" height="90"/>
  <text class="txt" x="900" y="108">DICOM</text>
