<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <rect width="1200" height="360" fill="#070b12"/>
  <style>
    .box{fill:#101827;stroke:#7fb7ff;stroke-width:2;rx:18}
    .txt{fill:#eef4ff;font-family:Arial,sans-serif;font-size:24px;font-weight:700}
    .sub{fill:#9fb2c8;font-family:Arial,sans-serif;font-size:15px}
    .arr{stroke:#7fb7ff;stroke-width:4;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#7fb7ff"/>
    </marker>
  </defs>
  <rect class="box" x="60" y="110" width="210" height="110"/>
  <text class="txt" x="105" y="155">DICOM</text>
  <text class="sub" x="92" y="185">CT imaging data</text>

  <line class="arr" x1="285" y1="165" x2="395" y2="165"/>

  <rect class="box" x="420" y="110" width="210" height="110"/>
  <text class="txt" x="485" y="155">ROI</text>
  <text class="sub" x="458" y="185">measurement area</text>

  <line class="arr" x1="645" y1="165" x2="755" y2="165"/>

  <rect class="box" x="780" y="110" width="210" height="110"/>
  <text class="txt" x="842" y="155">RSIF</text>
  <text class="sub" x="812" y="185">structured export</text>

  <line class="arr" x1="1005" y1="165" x2="1110" y2="165"/>

  <rect class="box" x="1120" y="110" width="60" height="110"/>
  <text class="txt" x="1130" y="155">AI</text>
  <text class="sub" x="1128" y="185">readable</text>

  <text class="sub" x="360" y="300">Public semantic diagram only — no production pipeline or proprietary implementation logic.</text>
</svg>
